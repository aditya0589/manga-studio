[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-studio-backend"
version = "0.1.0"
description = "AI Manga Studio Backend with LangGraph Agentic Workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "reportlab>=4.1.0",
    "pillow>=10.2.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.1",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "redis>=5.0.3",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
